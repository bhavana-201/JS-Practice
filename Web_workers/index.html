<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User</title>
  <link rel="stylesheet" href="styles.css">
  <script src="./ind.js" defer></script>
</head>

<body>
  <h1>Welcome</h1>
  <div>
    <input type="search" id="user-search" placeholder="search user by id...">
    <button type="click" id="search-btn">search </button>
    <button type="click" id="allUsers-btn">Show all users</button>
  </div>
  <div id="status" hidden></div>
  <div class="form">
    <form id="userForm">
      <label>Enter your Id: </label>
      <input type="text" name="id" id="id" placeholder="incase of update...">

      <label>Enter your First Name: </label>
      <input type="text" name="First_Name" required>

      <label>Enter your Last Name: </label>
      <input type="text" name="Last_Name" required>

      <label>Enter your Joining Date: </label>
      <input type="date" name="Joining" required>

      <button type="submit" id="submit">Submit</button>
      <button type="button" id="update">Update </button>

    </form>
  </div>

  <div id="user-output">

  </div>
</body>

</html>
